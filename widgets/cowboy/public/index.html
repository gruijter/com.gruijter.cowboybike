<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cowboy Bike Dashboard Widget</title>
  <style>
    :root {
      --bg-color: var(--homey-color-background, #16171a);
      --card-bg: var(--homey-color-card-background, #22242a);
      --text-main: var(--homey-color-text, #ffffff);
      --text-muted: var(--homey-color-text-light, #90939a);
      --text-subtle: #6c6f78;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --accent-orange: #ff9500;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .widget-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-width: 70%;
    }

    .bike-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: 10px;
      width: fit-content;
      background-color: rgba(52, 199, 89, 0.15);
      color: var(--accent-green);
    }

    .status-badge.alarm-danger {
      background-color: rgba(255, 59, 48, 0.2);
      color: var(--accent-red);
    }

    .status-badge.alarm-warning {
      background-color: rgba(255, 149, 0, 0.2);
      color: var(--accent-orange);
    }

    .status-badge.alarm-muted {
      background-color: rgba(142, 142, 147, 0.2);
      color: var(--text-muted);
    }

    .battery-info {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .battery-info span {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 1px;
    }

    .battery-bar-track {
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .battery-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-green);
      border-radius: 2px;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    /* Bike Showcase */
    .showcase {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 0;
      flex-grow: 1;
    }

    .bike-img {
      max-width: 80%;
      max-height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    /* Range Display */
    .range-section {
      text-align: center;
      margin-bottom: 8px;
    }

    .range-value {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.1;
    }

    .range-unit {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .range-subtitle {
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 1px;
    }

    /* Cards Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 10px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Location Footer */
    .location-footer {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 8px 10px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .location-address {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-details {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="widget-container" id="widget-main">
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <div class="bike-name" id="bike-name">COWBOY BIKE</div>
          <div class="status-badge" id="status-badge">🟢 PARKED</div>
        </div>
        <div class="battery-info"><span id="battery-val">--</span><span>%</span></div>
      </div>
      <div class="battery-bar-track">
        <div class="battery-bar-fill" id="battery-bar"></div>
      </div>
    </div>

    <!-- Showcase Bike Image -->
    <div class="showcase">
      <img src="bike.png" alt="Cowboy Bike" class="bike-img" />
    </div>

    <!-- Estimated Range -->
    <div class="range-section">
      <div>
        <span class="range-value" id="range-val">--</span>
        <span class="range-unit">km</span>
      </div>
      <div class="range-subtitle">estimated range</div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="trip-val">--</div>
        <div class="stat-label">trip km</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="speed-val">--</div>
        <div class="stat-label">km/h</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="odo-val">--</div>
        <div class="stat-label">total km</div>
      </div>
    </div>

    <!-- Location Footer -->
    <div class="location-footer" id="location-footer">
      <div class="location-address" id="location-address">📍 Location unknown</div>
      <div class="location-details">
        <span id="home-distance"></span>
        <span id="last-parked"></span>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready({ height: 440 });

      function getSelectedDeviceId() {
        var settings = Homey.getSettings();
        if (settings && settings.device) {
          return typeof settings.device === 'object' ? settings.device.id : settings.device;
        }
        if (typeof Homey.getDeviceIds === 'function') {
          var ids = Homey.getDeviceIds();
          if (ids && ids.length > 0) return ids[0];
        }
        return null;
      }

      function updateStatusBadge(data) {
        var badge = document.getElementById('status-badge');
        if (!badge) return;

        badge.className = 'status-badge';

        if (data.alarm_stolen) {
          badge.className += ' alarm-danger';
          badge.innerText = '🔴 STOLEN ALARM';
        } else if (data.alarm_crashed) {
          badge.className += ' alarm-danger';
          badge.innerText = '💥 CRASH ALARM';
        } else if (data.alarm_relocated) {
          badge.className += ' alarm-warning';
          badge.innerText = '🟡 RELOCATED';
        } else if (data.alarm_offline) {
          badge.className += ' alarm-muted';
          badge.innerText = '⚠️ OFFLINE';
        } else if (data.alarm_batt) {
          badge.className += ' alarm-warning';
          badge.innerText = '🪫 LOW BATTERY';
        } else {
          badge.innerText = '🟢 PARKED';
        }
      }

      function updateUI(data) {
        if (!data) return;

        var bikeName = document.getElementById('bike-name');
        var batteryVal = document.getElementById('battery-val');
        var batteryBar = document.getElementById('battery-bar');
        var rangeVal = document.getElementById('range-val');
        var tripVal = document.getElementById('trip-val');
        var speedVal = document.getElementById('speed-val');
        var odoVal = document.getElementById('odo-val');
        var locAddress = document.getElementById('location-address');
        var homeDist = document.getElementById('home-distance');
        var lastParked = document.getElementById('last-parked');
        var footer = document.getElementById('location-footer');

        if (bikeName) bikeName.innerText = (data.name || 'COWBOY BIKE').toUpperCase();
        
        var batt = Math.round(data.measure_battery || 0);
        if (batteryVal) batteryVal.innerText = batt;
        if (batteryBar) {
          batteryBar.style.width = batt + '%';
          batteryBar.style.backgroundColor = batt <= 20 ? 'var(--accent-red)' : 'var(--accent-green)';
        }

        if (rangeVal) rangeVal.innerText = Math.round(data.meter_range || 0);
        if (tripVal) tripVal.innerText = (data.meter_trip || 0).toFixed(1);
        if (speedVal) speedVal.innerText = (data.meter_speed || 0).toFixed(1);
        if (odoVal) odoVal.innerText = Math.round(data.meter_odo || 0);

        // Update Location & Status Footer
        var hasLocation = data.location && data.location.trim().length > 0;
        var hasDistance = data.meter_distance && data.meter_distance > 0;
        var hasParked = data.last_parked && data.last_parked.trim().length > 0;

        if (locAddress) {
          if (hasLocation) {
            locAddress.style.display = 'block';
            locAddress.innerText = '📍 ' + data.location;
          } else if (hasParked) {
            locAddress.style.display = 'block';
            locAddress.innerText = '📍 Parked: ' + data.last_parked;
          } else {
            locAddress.style.display = 'none';
          }
        }

        if (homeDist) {
          homeDist.innerText = hasDistance ? data.meter_distance.toFixed(1) + ' km from home' : '';
        }

        if (lastParked) {
          lastParked.innerText = (hasLocation && hasParked) ? 'Parked: ' + data.last_parked : '';
        }

        if (footer) {
          footer.style.display = (hasLocation || hasDistance || hasParked) ? 'flex' : 'none';
        }

        updateStatusBadge(data);
      }

      function fetchBikeData() {
        var deviceId = getSelectedDeviceId();
        var path = '/' + (deviceId ? '?deviceId=' + encodeURIComponent(deviceId) : '');

        Homey.api('GET', path, {})
          .then(function(result) {
            updateUI(result);
          })
          .catch(function(err) {
            console.error('Failed to fetch bike data:', err);
          });
      }

      fetchBikeData();
      setInterval(fetchBikeData, 10000);
    }
  </script>
</body>
</html>
