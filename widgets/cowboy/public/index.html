<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cowboy Bike Dashboard Widget</title>
  <style>
    :root {
      --bg-color: var(--homey-color-background, #16171a);
      --card-bg: var(--homey-color-card-background, #22242a);
      --text-main: var(--homey-color-text, #ffffff);
      --text-muted: var(--homey-color-text-light, #90939a);
      --text-subtle: #6c6f78;
      --accent-green: #34c759;
      --accent-blue: #0a84ff;
      --accent-red: #ff3b30;
      --accent-orange: #ff9500;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .widget-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      width: 100%;
    }

    /* Header */
    .header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 72%;
    }

    .bike-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      padding: 2px 7px;
      border-radius: 10px;
      width: fit-content;
      background-color: rgba(52, 199, 89, 0.15);
      color: var(--accent-green);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .status-badge.alarm-active {
      background-color: rgba(10, 132, 255, 0.2);
      color: var(--accent-blue);
    }

    .status-badge.alarm-danger {
      background-color: rgba(255, 59, 48, 0.2);
      color: var(--accent-red);
    }

    .status-badge.alarm-warning {
      background-color: rgba(255, 149, 0, 0.2);
      color: var(--accent-orange);
    }

    .status-badge.alarm-muted {
      background-color: rgba(142, 142, 147, 0.2);
      color: var(--text-muted);
    }

    .battery-info {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .battery-info span {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 1px;
    }

    .battery-bar-track {
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    .battery-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-green);
      border-radius: 2px;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    /* Bike Showcase */
    .showcase {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px 0;
      flex-grow: 1;
    }

    .bike-img {
      width: 92%;
      max-height: 155px;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
    }

    /* Range Display */
    .range-section {
      text-align: center;
      margin-bottom: 8px;
    }

    .range-value {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.1;
    }

    .range-unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .range-subtitle {
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 1px;
    }

    /* Cards Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 10px 4px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Location Footer */
    .location-footer {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 8px 10px;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .location-address {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-details {
      font-size: 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="widget-container" id="widget-main">
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <div class="bike-name" id="bike-name">COWBOY BIKE</div>
          <div class="status-badge" id="status-badge">🟢 PARKED</div>
        </div>
        <div class="battery-info"><span id="battery-val">--</span><span>%</span></div>
      </div>
      <div class="battery-bar-track">
        <div class="battery-bar-fill" id="battery-bar"></div>
      </div>
    </div>

    <!-- Showcase Bike Image -->
    <div class="showcase">
      <img src="bike.png" alt="Cowboy Bike" class="bike-img" />
    </div>

    <!-- Estimated Range -->
    <div class="range-section">
      <div>
        <span class="range-value" id="range-val">--</span>
        <span class="range-unit">km</span>
      </div>
      <div class="range-subtitle">estimated range</div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="trip-val">--</div>
        <div class="stat-label">trip km</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="speed-val">--</div>
        <div class="stat-label">avg km/h</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="odo-val">--</div>
        <div class="stat-label">total km</div>
      </div>
    </div>

    <!-- Location Footer -->
    <div class="location-footer" id="location-footer">
      <div class="location-address" id="location-address">📍 Location: Unavailable</div>
      <div class="location-details" id="home-distance"></div>
    </div>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      Homey.ready({ height: 440 });

      var lang = (typeof Homey.getLanguage === 'function' ? Homey.getLanguage() : 'en').toLowerCase().substring(0, 2);
      var translations = {
        en: { range: 'estimated range', trip: 'trip km', speed: 'avg km/h', odo: 'total km', location: 'Location', unavailable: 'Unavailable', fromHome: 'km from home', parked: 'PARKED', moving: 'ON THE MOVE', offline: 'OFFLINE', stolen: 'STOLEN ALARM', crash: 'CRASH ALARM', relocated: 'RELOCATED', lowBatt: 'LOW BATTERY', battRemoved: 'BATTERY REMOVED' },
        nl: { range: 'geschatte actieradius', trip: 'rit km', speed: 'gem km/h', odo: 'totaal km', location: 'Locatie', unavailable: 'Onbeschikbaar', fromHome: 'km van huis', parked: 'GEPARKEERD', moving: 'IN BEWEGING', offline: 'OFFLINE', stolen: 'DIEFSTAL ALARM', crash: 'VALPARTIJ ALARM', relocated: 'VERPLAATST', lowBatt: 'ACCU LEEG', battRemoved: 'ACCU VERWIJDERD' },
        de: { range: 'geschätzte Reichweite', trip: 'Fahrt km', speed: 'Ø km/h', odo: 'Gesamt km', location: 'Standort', unavailable: 'Nicht verfügbar', fromHome: 'km von zu Hause', parked: 'GEPARKT', moving: 'IN BEWEGUNG', offline: 'OFFLINE', stolen: 'DIEBSTAHLALARM', crash: 'STURZALARM', relocated: 'BEWEGT', lowBatt: 'AKKU SCHWACH', battRemoved: 'AKKU ENTFERNT' },
        fr: { range: 'autonomie estimée', trip: 'trajet km', speed: 'moy km/h', odo: 'total km', location: 'Emplacement', unavailable: 'Indisponible', fromHome: 'km de la maison', parked: 'STATIONNÉ', moving: 'EN DÉPLACEMENT', offline: 'HORS LIGNE', stolen: 'ALARME VOL', crash: 'ALARME CHUTE', relocated: 'DÉPLACÉ', lowBatt: 'BATTERIE FAIBLE', battRemoved: 'BATTERIE RETIRÉE' },
        it: { range: 'autonomia stimata', trip: 'viaggio km', speed: 'med km/h', odo: 'totale km', location: 'Posizione', unavailable: 'Non disponibile', fromHome: 'km da casa', parked: 'PARCHEGGIATA', moving: 'IN MOVIMENTO', offline: 'OFFLINE', stolen: 'ALLARME FURTO', crash: 'ALLARME INCIDENTE', relocated: 'SPOSTATA', lowBatt: 'BATTERIA SCARICA', battRemoved: 'BATTERIA RIMOSTA' },
        es: { range: 'autonomía estimada', trip: 'viaje km', speed: 'prom km/h', odo: 'total km', location: 'Ubicación', unavailable: 'No disponible', fromHome: 'km de casa', parked: 'ESTACIONADA', moving: 'EN MOVIMIENTO', offline: 'DESCONECTADO', stolen: 'ALARMA ROBO', crash: 'ALARMA ACCIDENTE', relocated: 'DESPLAZADA', lowBatt: 'BATERÍA BAJA', battRemoved: 'BATERÍA RETIRADA' },
        sv: { range: 'uppskattad räckvidd', trip: 'resa km', speed: 'snitt km/h', odo: 'totalt km', location: 'Plats', unavailable: 'Ej tillgänglig', fromHome: 'km hemifrån', parked: 'PARKERAD', moving: 'I RÖRELSE', offline: 'OFFLINE', stolen: 'STÖDLARM', crash: 'KRASCHLARM', relocated: 'FLYTTAD', lowBatt: 'LÅGT BATTERI', battRemoved: 'BATTERI BORTTAGET' },
        no: { range: 'estimert rekkevidde', trip: 'tur km', speed: 'snitt km/h', odo: 'totalt km', location: 'Posisjon', unavailable: 'Utilgjengelig', fromHome: 'km fra hjemmet', parked: 'PARKERT', moving: 'I BEVEGELSE', offline: 'OFFLINE', stolen: 'TYVERIALARM', crash: 'KRASJALARM', relocated: 'FLYTTET', lowBatt: 'LAVT BATTERI', battRemoved: 'BATTERI FJERNET' },
        da: { range: 'forventet rækkevidde', trip: 'tur km', speed: 'gns km/h', odo: 'samlet km', location: 'Placering', unavailable: 'Utilgængelig', fromHome: 'km fra hjemmet', parked: 'PARKERET', moving: 'I BEVÆGELSE', offline: 'OFFLINE', stolen: 'TYVERIALARM', crash: 'STURZALARM', relocated: 'FLYTTET', lowBatt: 'LAVT BATTERI', battRemoved: 'BATTERI FJERNET' },
        pl: { range: 'szacowany zasięg', trip: 'trasa km', speed: 'śr km/h', odo: 'całkowity km', location: 'Lokalizacja', unavailable: 'Niedostępna', fromHome: 'km od domu', parked: 'ZAPARKOWANY', moving: 'W RUCHU', offline: 'OFFLINE', stolen: 'ALARM KRADZIEŻY', crash: 'ALARM WYPADKU', relocated: 'PRZEMIESZCZONY', lowBatt: 'NISKI POZIOM BATERII', battRemoved: 'BATERIA WYJĘTA' }
      };
      var t = translations[lang] || translations.en;

      // Apply static label translations
      var lblRange = document.querySelector('.range-subtitle');
      if (lblRange) lblRange.innerText = t.range;
      var lblGrid = document.querySelectorAll('.stat-label');
      if (lblGrid && lblGrid.length >= 3) {
        lblGrid[0].innerText = t.trip;
        lblGrid[1].innerText = t.speed;
        lblGrid[2].innerText = t.odo;
      }

      function getSelectedDeviceId() {
        var settings = typeof Homey.getSettings === 'function' ? Homey.getSettings() : {};
        if (settings && settings.device) {
          if (typeof settings.device === 'string') return settings.device;
          if (typeof settings.device === 'object') {
            if (settings.device.id) return String(settings.device.id);
            if (settings.device.data && settings.device.data.id) return String(settings.device.data.id);
          }
        }
        if (typeof Homey.getDeviceIds === 'function') {
          var ids = Homey.getDeviceIds();
          if (ids && ids.length > 0) return String(ids[0]);
        }
        return null;
      }

      function updateStatusBadge(data) {
        var badge = document.getElementById('status-badge');
        if (!badge) return;

        badge.className = 'status-badge';

        if (data.alarm_stolen || data.position_type === 'stolen') {
          badge.className += ' alarm-danger';
          badge.innerText = '🔴 ' + t.stolen;
        } else if (data.alarm_crashed) {
          badge.className += ' alarm-danger';
          badge.innerText = '💥 ' + t.crash;
        } else if (data.alarm_battery_removed || data.battery_inserted === false) {
          badge.className += ' alarm-warning';
          badge.innerText = '🪫 ' + t.battRemoved;
        } else if (data.alarm_relocated) {
          badge.className += ' alarm-warning';
          badge.innerText = '🟡 ' + t.relocated;
        } else if (data.alarm_offline) {
          badge.className += ' alarm-muted';
          badge.innerText = '⚠️ ' + t.offline;
        } else if (data.alarm_batt) {
          badge.className += ' alarm-warning';
          badge.innerText = '🪫 ' + t.lowBatt;
        } else if (data.position_type === 'trip' || data.current_speed > 0) {
          badge.className += ' alarm-active';
          var speedText = data.current_speed > 0 ? ' (' + data.current_speed.toFixed(1) + ' km/h)' : '';
          badge.innerText = '🚴 ' + t.moving + speedText;
        } else {
          var parkedTime = data.last_parked ? ' (' + data.last_parked + ')' : '';
          badge.innerText = '🟢 ' + t.parked + parkedTime;
        }
      }

      function updateUI(data) {
        if (!data) return;

        var bikeName = document.getElementById('bike-name');
        var batteryVal = document.getElementById('battery-val');
        var batteryBar = document.getElementById('battery-bar');
        var rangeVal = document.getElementById('range-val');
        var tripVal = document.getElementById('trip-val');
        var speedVal = document.getElementById('speed-val');
        var odoVal = document.getElementById('odo-val');
        var locAddress = document.getElementById('location-address');
        var homeDist = document.getElementById('home-distance');

        if (bikeName) bikeName.innerText = (data.name || 'COWBOY BIKE').toUpperCase();
        
        var batt = Math.round(data.measure_battery || 0);
        if (batteryVal) batteryVal.innerText = batt;
        if (batteryBar) {
          batteryBar.style.width = batt + '%';
          batteryBar.style.backgroundColor = batt <= 20 ? 'var(--accent-red)' : 'var(--accent-green)';
        }

        if (rangeVal) rangeVal.innerText = Math.round(data.meter_range || 0);
        if (tripVal) tripVal.innerText = (data.meter_trip || 0).toFixed(1);
        if (speedVal) speedVal.innerText = (data.meter_speed || 0).toFixed(1);
        if (odoVal) odoVal.innerText = Math.round(data.meter_odo || 0);

        // Update Location & Saved Place
        var addressText = t.unavailable;
        if (data.place) {
          addressText = data.place + (data.location ? ' (' + data.location + ')' : '');
        } else if (data.location && data.location.trim().length > 0) {
          addressText = data.location;
        }

        if (locAddress) {
          locAddress.innerText = '📍 ' + t.location + ': ' + addressText;
        }

        if (homeDist) {
          if (data.meter_distance && data.meter_distance > 0) {
            homeDist.innerText = data.meter_distance.toFixed(1) + ' ' + t.fromHome;
            homeDist.style.display = 'block';
          } else {
            homeDist.style.display = 'none';
          }
        }

        function updateBikeImage(modelName) {
          var imgEl = document.querySelector('.bike-img');
          if (!imgEl) return;
          var model = (modelName || '').toLowerCase();

          if (model.indexOf('cross') !== -1) {
            imgEl.src = 'bike_cross.png';
          } else if (model.indexOf('cruiser') !== -1 || model.indexOf('st') !== -1) {
            imgEl.src = 'bike_cruiser.png';
          } else if (model.indexOf('4') !== -1 || model.indexOf('classic') !== -1) {
            imgEl.src = 'bike_c4.png';
          } else {
            imgEl.src = 'bike.png';
          }
        }

        updateBikeImage(data.model);
        updateStatusBadge(data);
      }

      function fetchBikeData() {
        var deviceId = getSelectedDeviceId();
        var path = '/' + (deviceId ? '?deviceId=' + encodeURIComponent(deviceId) : '');

        Homey.api('GET', path, {})
          .then(function(result) {
            updateUI(result);
          })
          .catch(function(err) {
            console.error('Failed to fetch bike data:', err);
          });
      }

      fetchBikeData();
      if (typeof Homey.onSettings === 'function') {
        Homey.onSettings(function() {
          fetchBikeData();
        });
      }
      setInterval(fetchBikeData, 10000);
    }
  </script>
</body>
</html>
